name: SBOM and Vulnerability Intelligence

on:
  push:
    branches: [master]
  schedule:
    - cron: "7 2 * * 0"
  workflow_dispatch:

concurrency:
  group: sbom-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  syft-grype:
    name: Syft SBOM + Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Syft 1.52.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/syft.deb \
            https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.deb
          echo "c8e13cd04f78b5cf90a70b2e45d2a4b7ec9aa0aa129d3001cd5d488103351b7f  /tmp/syft.deb" | sha256sum --check --strict
          sudo dpkg -i /tmp/syft.deb
          syft version

      - name: Generate CycloneDX and SPDX SBOMs
        shell: bash
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json

      - name: Install pinned Grype 0.119.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/grype.deb \
            https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.deb
          echo "361952c0d9ead70b09d9305835811ea06e038e59a08d99b4891a368c6aa22dde  /tmp/grype.deb" | sha256sum --check --strict
          sudo dpkg -i /tmp/grype.deb
          grype version

      - name: Scan SBOM with Grype
        shell: bash
        run: |
          grype sbom:sbom.cdx.json -o sarif --file grype.sarif

      - name: Upload Grype results
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype.sarif
          category: grype-sbom

      - name: Enforce Grype HIGH severity gate
        shell: bash
        run: |
          grype sbom:sbom.cdx.json --fail-on high

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doublecmd-sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  osv-full-scan:
    name: OSV-Scanner Full Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: false
