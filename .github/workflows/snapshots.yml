name: build-snapshot

on:
  workflow_dispatch:
  push:
    paths:
    - 'components/**'
    - 'plugins/**'
    - 'sdk/**'
    - 'src/**'
    branches:
      - master

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-15
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - name: Restore fpc from cache
      id: fpc-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Download fpc from site
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      run: |
            curl -L -o "${{ runner.temp }}/fpc.dmg" \
              https://github.com/doublecmd/fpc-3.2.x/releases/download/v3.2.4-rc2/fpc-3.2.4-rc2-aarch64-macosx.dmg
            hdiutil attach "${{ runner.temp }}/fpc.dmg" -mountpoint "${{ runner.temp }}/fpc-dmg"

    - name: Save fpc to cache
      if: steps.fpc-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/fpc-dmg
        key: ${{ runner.os }}-fpc

    - name: Install Free Pascal
      run: |
           sudo installer -pkg "${{ runner.temp }}/fpc-dmg/fpc-3.2.4-rc2-aarch64-macosx.pkg" -target /
           sudo fpcmkcfg -d "basepath=/usr/local/lib/fpc/3.2.4" -o /etc/fpc.cfg

    - name: Get Lazarus source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
            repository: 'fpc/Lazarus'

    - name: Build and install Lazarus
      run: |
           make all
           sudo make install

    - name: Create Lazarus config
      run: |
           mkdir -p $HOME/.lazarus
           cp tools/install/macosx/environmentoptions.xml $HOME/.lazarus/environmentoptions.xml
           sed -i -e "s|_PPCARCH_|fpc|g; s|/Developer/lazarus|/usr/local/share/lazarus|g" $HOME/.lazarus/environmentoptions.xml

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Prepare source
      run: sed -i -e "s|BOX_CLIENT_SECRET = '\*'|BOX_CLIENT_SECRET = '$BOX_CLIENT_SECRET'|g" plugins/wfx/MacCloud/src/drivers/oauth2/box/uboxclient.pas
      env:
        BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}

    - name: Build packages
      run: ./.github/scripts/create_snapshot.sh

    - name: Share data between jobs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snapshot-mac
        retention-days: 1
        compression-level: 0
        path: doublecmd-release/doublecmd*.dmg

  build-win:
    runs-on: windows-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - name: Install Lazarus
      uses: doublecmd/lazarus-install@ee1d9999908fe25e110d37b61b90845387749423 # win
      with:
        lazarus-version: "stable"

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Restore timestamps
      uses: step-security/git-restore-mtime-action@3f7289f47fd7b351fbc8f560f4e17140c3716183 # v2.3.0

    - name: Build packages
      run: ./.github/scripts/create_snapshot.bat

    - name: Share data between jobs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snapshot-win
        retention-days: 1
        compression-level: 0
        path: doublecmd-release/*

  build-lin:
    runs-on: ubuntu-22.04
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - name: Install dependencies
      run: |
           sudo apt update
           sudo apt install fp-units-rtl fp-units-gtk2 fp-compiler fp-units-base fp-units-fcl \
                            fp-units-misc fp-units-net fp-utils patchelf libgtk-3-dev libdbus-1-dev zip

    - name: Get Lazarus source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
            repository: 'fpc/Lazarus'
            ref: 'fixes_5'

    - name: Build and install Lazarus
      run: |
           make all
           sudo make install

    - name: Create Lazarus config
      run: |
           mkdir -p $HOME/.lazarus
           cp tools/install/linux/environmentoptions.xml $HOME/.lazarus/environmentoptions.xml
           sed -i -e "s|__LAZARUSDIR__|/usr/local/share/lazarus|g" $HOME/.lazarus/environmentoptions.xml

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Build packages
      run: ./.github/scripts/create_snapshot.lnx

    - name: Share data between jobs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snapshot-lin
        retention-days: 1
        compression-level: 0
        path: doublecmd-release/doublecmd*.tar.xz

  upload:
    needs: [build-win, build-mac, build-lin]
    runs-on: ubuntu-latest
    environment: snapshots
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        use-policy-store: true
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true

    - name: Save revision number
      run: echo "REVISION=$(cat revision.txt)" >> "$GITHUB_ENV"
      shell: bash

    - name: Upload binaries to snapshots
      uses: step-security/upload-release-action@ecbc6042326f3a6f5a8c1c1202c4fa1b244db249 # v2.11.4
      with:
        repo_name: doublecmd/snapshots
        repo_token: ${{ secrets.SNAPSHOTS }}
        file: ./*
        release_name: Revision ${{ env.REVISION }}
        tag: ${{ env.REVISION }}
        body: ${{ vars.BODY }}
        overwrite: true
        file_glob: true
